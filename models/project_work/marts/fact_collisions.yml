version: 2

models:
  - name: fact_collisions
    columns:
      - name: collision_key
        tests:
          - unique
          - not_null

      - name: collision_id
        tests:
          - unique
          - not_null

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_project_date')
                field: date_key

      - name: location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_project_location')
                field: location_key

      - name: time_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crash_time')
                field: time_key

      - name: severity_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crash_severity')
                field: severity_key

      - name: crash_count
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false